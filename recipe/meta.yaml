{% set name = "jinja2-git" %}
{% set version = "1.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 81481c534f96b1754cc6f8548d0e2b6509c44a6c0915a1521ff7e43f27a7acf2

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core >=1.2.0
    - pip
  run:
    - python >={{ python_min }},<4.0.0
    - jinja2 >=2.10,<4.0

test:
  imports:
    - jinja2_git
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/wemake-services/jinja2-git
  summary: Jinja2 extension to handle git-specific things
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mediocretech
